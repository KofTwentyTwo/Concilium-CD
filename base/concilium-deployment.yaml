---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: concilium-backend
  namespace: concilium
  labels:
    app: concilium-backend
    component: backend
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: concilium-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: concilium-backend
        component: backend
    spec:
      serviceAccountName: concilium-backend
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          command:
            [
              "sh",
              "-c",
              "until nc -z concilium-postgres-pooler 5432; do echo waiting for postgres; sleep 2; done",
            ]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
        - name: run-migrations
          image: ghcr.io/koftwentytwo/concilium-migrations:develop
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: LIQUIBASE_URL
              value: "jdbc:postgresql://concilium-postgres-pooler:5432/concilium"
            - name: LIQUIBASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: concilium.concilium-postgres.credentials.postgresql.acid.zalan.do
                  key: username
            - name: LIQUIBASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: concilium.concilium-postgres.credentials.postgresql.acid.zalan.do
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      containers:
        - image: ghcr.io/koftwentytwo/concilium:develop
          imagePullPolicy: Always
          name: concilium-backend
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: RDBMS_VENDOR
              value: "postgresql"
            - name: RDBMS_HOSTNAME
              value: "concilium-postgres-pooler"
            - name: RDBMS_PORT
              value: "5432"
            - name: RDBMS_DATABASE_NAME
              value: "concilium"
            - name: RDBMS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: concilium.concilium-postgres.credentials.postgresql.acid.zalan.do
                  key: username
            - name: RDBMS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: concilium.concilium-postgres.credentials.postgresql.acid.zalan.do
                  key: password
            - name: S3_ENDPOINT
              value: "http://concilium-minio:9000"
            - name: S3_BUCKET_NAME
              value: "concilium-artifacts"
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: concilium-minio-secrets
                  key: MINIO_ROOT_USER
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: concilium-minio-secrets
                  key: MINIO_ROOT_PASSWORD
            - name: S3_REGION
              value: "us-east-1"
            - name: AUTH_MODE
              value: "dev_local"
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}