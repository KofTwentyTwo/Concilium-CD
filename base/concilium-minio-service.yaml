---
apiVersion: v1
kind: Service
metadata:
  name: concilium-minio
  namespace: concilium
  labels:
    app: concilium-minio
spec:
  type: ClusterIP
  selector:
    app: concilium-minio
  ports:
    - name: api
      port: 9000
      targetPort: api
    - name: console
      port: 9001
      targetPort: console